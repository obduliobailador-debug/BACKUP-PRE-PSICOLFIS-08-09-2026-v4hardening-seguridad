        <!-- JSON-LD: FAQ -->
        <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    { "@type": "Question", "name": "¿Qué es un agente de IA personalizado?",
      "acceptedAnswer": { "@type": "Answer", "text": "Es un asistente diseñado para pensar y responder con tu tono, tus criterios y tus objetivos. No es genérico: se entrena con tu forma de trabajar y representa tu negocio." } },
    { "@type": "Question", "name": "¿Necesito conocimientos técnicos?",
      "acceptedAnswer": { "@type": "Answer", "text": "No. Nosotros configuramos e integramos todo; tú lo usas como una herramienta diaria con nuestro soporte completo." } },
    { "@type": "Question", "name": "¿Cuánto tarda la implementación?",
      "acceptedAnswer": { "@type": "Answer", "text": "Un piloto suele estar listo en 5-10 días hábiles según complejidad e integraciones necesarias." } },
    { "@type": "Question", "name": "¿Qué tareas puede cubrir un agente?",
      "acceptedAnswer": { "@type": "Answer", "text": "Respuestas a clientes, redacción de contenidos, guiones de vídeo, filtrado de leads, soporte interno, emails, documentación, y muchísimo más." } },
    { "@type": "Question", "name": "¿Cómo se entrena con mi tono?",
      "acceptedAnswer": { "@type": "Answer", "text": "Analizamos ejemplos de tu comunicación (textos, vídeos) y definimos una guía de estilo que el agente respeta en cada interacción." } },
    { "@type": "Question", "name": "¿Mis datos están seguros?",
      "acceptedAnswer": { "@type": "Answer", "text": "Sí. Trabajamos con buenas prácticas de privacidad, solo usamos los datos estrictamente necesarios y bajo acuerdos de confidencialidad." } },
    { "@type": "Question", "name": "¿Cumple con RGPD?",
      "acceptedAnswer": { "@type": "Answer", "text": "Sí, diseñamos el uso para alinearlo con RGPD/LOPDGDD. Te orientamos en cláusulas y avisos básicos necesarios." } },
    { "@type": "Question", "name": "¿Qué diferencia hay con un chatbot genérico?",
      "acceptedAnswer": { "@type": "Answer", "text": "Un chatbot genérico responde sin contexto. Un agente personalizado entiende tu negocio, tu tono y tus objetivos específicos." } },
    { "@type": "Question", "name": "¿Puedo integrarlo en mi web actual?",
      "acceptedAnswer": { "@type": "Answer", "text": "Sí. Podemos añadirlo como widget, iframe o vía API según tu plataforma y necesidades." } },
    { "@type": "Question", "name": "¿Qué mantenimiento requiere?",
      "acceptedAnswer": { "@type": "Answer", "text": "Actualizaciones periódicas, revisión de respuestas y afinación según nuevos productos, campañas o cambios en tu negocio." } },
    { "@type": "Question", "name": "¿Cómo medimos resultados?",
      "acceptedAnswer": { "@type": "Answer", "text": "Definimos KPIs (tiempo ahorrado, calidad de respuesta, conversión) y revisamos mejoras en ciclos mensuales con reportes claros." } },
    { "@type": "Question", "name": "¿Ofrecen formación para mi equipo?",
      "acceptedAnswer": { "@type": "Answer", "text": "Sí. Incluimos una sesión de uso y buenas prácticas, con opciones de formación ampliada si la necesitas." } }
  ]
}
        </script>
